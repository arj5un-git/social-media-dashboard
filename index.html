
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Hub — Friends First</title>
<style>
:root {
  --bg:#101116; --panel:#1b1c25; --line:#30313e;
  --text:#f5f3ff; --muted:#aaa9bb; --accent:#b9a0ff;
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--text);
  font:15px system-ui,sans-serif }
button,input { font:inherit }
button { cursor:pointer }
.app { max-width:1100px; margin:auto; padding:18px }
header { padding:12px 0 }
h1 { margin:0; font-size:27px }
h2 { font-size:18px; margin:0 0 12px }
p { color:var(--muted); line-height:1.5 }
.muted { color:var(--muted); font-size:13px }
.notice { border:1px solid var(--line); border-radius:12px;
  padding:12px; color:var(--muted); font-size:13px }
.tabs,.actions { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 }
.btn,.tab { border:1px solid var(--line); border-radius:10px;
  padding:10px 13px; background:var(--panel); color:var(--text) }
.tab.active,.primary { background:var(--accent); color:#201532;
  border-color:var(--accent) }
.layout { display:grid; grid-template-columns:240px minmax(0,1fr); gap:15px }
.panel { background:var(--panel); border:1px solid var(--line);
  border-radius:15px; padding:15px; min-width:0 }
.friend { width:100%; text-align:left; padding:12px 10px;
  background:transparent; border:0; border-radius:9px;
  color:var(--text); border-bottom:1px solid var(--line) }
.friend.active { background:#342a46 }
.friend small { display:block; color:var(--muted); margin-top:4px }
.reel { border-top:1px solid var(--line); padding-top:14px; margin-top:16px }
.embed { width:100%; min-height:470px; border:0; border-radius:10px;
  background:#fff; display:block }
.message { padding:10px 0; border-bottom:1px solid var(--line) }
.reply { display:flex; gap:8px; margin-top:14px }
.reply input { flex:1; min-width:0; background:var(--bg); color:var(--text);
  border:1px solid var(--line); padding:12px; border-radius:9px }
#feedback { color:#c9b8ff; font-size:13px; margin-top:12px }
@media(max-width:650px) {
  .app { padding:12px }
  .layout { grid-template-columns:1fr }
  .friends { display:grid; grid-template-columns:1fr 1fr; gap:4px }
  .embed { min-height:420px }
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>💜 Social Hub</h1>
  <p>Your friends. Their messages. No endless feed.</p>
</header>

<div class="notice">
  PROTOTYPE MODE · Friends and messages below are demo data.
  Instagram reels are embedded from the links you supplied.
</div>

<div class="tabs">
  <button class="tab active" data-tab="inbox">💬 Friends & messages</button>
  <button class="tab" data-tab="reels">🎬 Shared reels</button>
</div>

<div class="layout">
  <section class="panel">
    <h2 id="friendTitle">Your friends</h2>
    <div class="friends" id="friends"></div>
  </section>

  <section class="panel">
    <div id="conversation"></div>
  </section>
</div>

<p class="notice" style="margin-top:15px">
  No recommendations or Explore page. Watch what you came for, reply,
  and leave when you're caught up.
</p>
</div>

<script>
const reelLinks = [
  "https://www.instagram.com/reel/DeJfc72SR0V/",
  "https://www.instagram.com/reel/Dd3vNerxIZD/",
  "https://www.instagram.com/reel/DdlCy3IGIrQ/"
];

const names = [
  "Anwar","Ashkar","Anil","Bibin","Athul","Amel",
  "Bharath","Adhi","Sidu","Aswin","Jojith"
];

// These are demo assignments, not real sender information.
const friends = names.map((name, i) => ({
  id:i,
  name,
  messages: [
    {from:name, text:"Hey! Check this out 😊"},
    ...(i < 3 ? [{from:name, text:"A reel for you", reel:i}] : [])
  ]
}));

let selected = 0;
let tab = "inbox";
const localReplies = {};

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function renderFriends() {
  const visible = tab === "reels"
    ? friends.filter(f => f.messages.some(m => m.reel !== undefined))
    : friends;

  document.getElementById("friendTitle").textContent =
    tab === "reels" ? "Friends with demo reels" : "Your friends";

  document.getElementById("friends").innerHTML = visible.map(f => `
    <button class="friend ${selected === f.id ? "active" : ""}"
      data-friend="${f.id}">
      <strong>${escapeHTML(f.name)}</strong>
      <small>${f.messages.some(m => m.reel !== undefined)
        ? "🎬 Reel in demo" : "Conversation demo"}</small>
    </button>
  `).join("");

  document.querySelectorAll("[data-friend]").forEach(b => {
    b.onclick = () => {
      selected = Number(b.dataset.friend);
      render();
    };
  });
}

function renderConversation() {
  const friend = friends[selected];
  const root = document.getElementById("conversation");
  const messages = friend.messages.filter(m =>
    tab !== "reels" || m.reel !== undefined
  );

  root.innerHTML = `
    <h2>${escapeHTML(friend.name)}</h2>
    <p class="muted">${tab === "reels"
      ? "Reels in this demo conversation"
      : "Conversation preview"}</p>

    <div id="messages">
      ${messages.map((m, i) => `
        <div class="message">
          <strong>${escapeHTML(m.from)}</strong>
          <div>${escapeHTML(m.text)}</div>

          ${m.reel !== undefined ? `
            <div class="reel">
              <p>🎬 Reel shared in this demo</p>
              <iframe class="embed"
                src="${reelLinks[m.reel]}embed/"
                title="Instagram reel ${m.reel + 1}"
                loading="lazy"
                allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture">
              </iframe>

              <p class="muted">
                If playback is unavailable, Instagram may restrict this embed.
              </p>

              <div class="actions">
                <button class="btn react" data-react="${m.reel}">
                  🤍 React (demo)
                </button>
                <button class="btn reply-reel" data-reply="${m.reel}">
                  💬 Reply to reel
                </button>
                <button class="btn" data-open="${m.reel}">
                  Open original
                </button>
              </div>
              <div id="reaction-${m.reel}" class="muted"></div>
            </div>
          ` : ""}
        </div>
      `).join("")}
    </div>

    <form class="reply" id="replyForm">
      <input id="replyText" maxlength="500"
        placeholder="Write a demo message..." required>
      <button class="btn primary">Send</button>
    </form>
    <div id="feedback" aria-live="polite"></div>
  `;

  root.querySelectorAll("[data-react]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.react;
      const active = b.dataset.active === "yes";
      b.dataset.active = active ? "no" : "yes";
      b.textContent = active ? "🤍 React (demo)" : "❤️ Reacted (demo)";
      document.getElementById("reaction-" + id).textContent =
        active ? "" : "Your demo reaction is selected.";
    };
  });

  root.querySelectorAll("[data-reply]").forEach(b => {
    b.onclick = () => {
      const input = document.getElementById("replyText");
      input.value = "😂 ";
      input.focus();
    };
  });

  root.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => window.open(
      reelLinks[Number(b.dataset.open)], "_blank", "noopener"
    );
  });

  document.getElementById("replyForm").onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("replyText");
    const value = input.value.trim();
    if (!value) return;

    (localReplies[selected] ||= []).push(value);
    document.getElementById("feedback").textContent =
      "Demo reply saved in this page's current session.";
    input.value = "";
    showReplies();
  };

  showReplies();
}

function showReplies() {
  const list = document.getElementById("messages");
  if (!list) return;

  (localReplies[selected] || []).forEach((text, i) => {
    if (list.querySelector('[data-local-reply="' + i + '"]')) return;
    const item = document.createElement("div");
    item.className = "message";
    item.dataset.localReply = i;
    const name = document.createElement("strong");
    name.textContent = "You";
    const msg = document.createElement("div");
    msg.textContent = text;
    item.append(name, msg);
    list.appendChild(item);
  });
}

function render() {
  renderFriends();
  renderConversation();
}

document.querySelectorAll("[data-tab]").forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(x =>
      x.classList.toggle("active", x === b)
    );
    selected = tab === "reels" ? 0 : selected;
    render();
  };
});

render();
</script>
</body>
</html>
